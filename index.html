<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 → 서울·청주 4박 5일 가족 여행 체크리스트</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Pretendard & Inter -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        warm: {
                            50: '#FDFBF7',
                            100: '#F7F1E5',
                            200: '#EFE3CC',
                            300: '#E2CEAA',
                            400: '#D2B482',
                            500: '#C49A5E',
                            600: '#B08048',
                            700: '#92643A',
                            800: '#785234',
                            900: '#63442D',
                        },
                        sage: {
                            50: '#F4F7F4',
                            100: '#E3EBE3',
                            500: '#5C8365',
                            600: '#486850',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FDFBF7;
            color: #3D352E;
            -webkit-tap-highlight-color: transparent;
        }
        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F7F1E5;
        }
        ::-webkit-scrollbar-thumb {
            background: #D2B482;
            border-radius: 9999px;
        }
        /* 체크박스 애니메이션 */
        .checkbox-wrapper input:checked + div {
            background-color: #5C8365;
            border-color: #5C8365;
        }
        .checkbox-wrapper input:checked + div svg {
            stroke-dashoffset: 0;
        }
        .check-icon {
            stroke-dasharray: 24;
            stroke-dashoffset: 24;
            transition: stroke-dashoffset 0.25s cubic-bezier(0.65, 0, 0.45, 1);
        }
        /* 아코디언 트랜지션 */
        .accordion-content {
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen pb-16 antialiased selection:bg-warm-200 selection:text-warm-900">

    <!-- 상단 헤더 & 요약 카드 (Sticky on Desktop, Smooth scroll) -->
    <header class="bg-gradient-to-b from-warm-100 to-warm-50 pt-6 pb-4 px-4 sm:px-6 border-b border-warm-200/70">
        <div class="max-w-3xl mx-auto">
            <!-- 여행 타이틀 배지 -->
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white border border-warm-200 shadow-sm text-xs font-semibold text-warm-800">
                    <span>🍊 제주(성산)</span>
                    <i data-lucide="arrow-right" class="w-3.5 h-3.5 text-warm-500"></i>
                    <span>🏙️ 서울 · 청주</span>
                </div>
                <span class="text-xs font-medium text-warm-700 bg-warm-200/60 px-2.5 py-1 rounded-full">
                    👶 5개월 아기 동반 4박 5일
                </span>
            </div>

            <h1 class="text-2xl sm:text-3xl font-bold text-stone-800 tracking-tight mb-1">
                맞춤형 짐 & 출발 체크리스트
            </h1>
            <p class="text-sm text-stone-500 mb-5 flex items-center gap-1.5">
                <i data-lucide="calendar" class="w-4 h-4 text-warm-600"></i>
                <span>2026. 11. 19(목) ~ 11. 23(월) · 한파 대비 & 본가 미션 포함</span>
            </p>

            <!-- 상단 요약 대시보드 카드 -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-warm-200/80 transition-all">
                <div class="flex items-end justify-between mb-2">
                    <div>
                        <span class="text-xs font-semibold uppercase tracking-wider text-warm-600 block mb-0.5">전체 준비 진행률</span>
                        <div class="flex items-baseline gap-2">
                            <span id="progress-percent" class="text-3xl font-extrabold text-stone-800">0%</span>
                            <span id="progress-count" class="text-sm font-medium text-stone-500">(0 / 0 완료)</span>
                        </div>
                    </div>
                    <div id="status-badge" class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-warm-100 text-warm-800">
                        차근차근 챙겨볼까요? 🧳
                    </div>
                </div>

                <!-- 프로그레스 바 -->
                <div class="w-full h-3.5 bg-warm-100 rounded-full overflow-hidden mb-4 p-0.5 border border-warm-200/50">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-warm-500 to-sage-500 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                </div>

                <!-- 컨트롤 바 (미완료만 보기 토글 & 초기화) -->
                <div class="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-stone-100">
                    <!-- 미완료만 보기 스위치 -->
                    <label class="inline-flex items-center cursor-pointer select-none group">
                        <input type="checkbox" id="filter-uncompleted" class="sr-only peer">
                        <div class="relative w-10 h-6 bg-stone-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-stone-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-warm-600"></div>
                        <span class="ms-2.5 text-sm font-medium text-stone-700 group-hover:text-stone-900">미완료 항목만 보기</span>
                    </label>

                    <!-- 우측 버튼 그룹 -->
                    <div class="flex items-center gap-2">
                        <button onclick="openModal('reset-check')" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-stone-600 bg-stone-100 hover:bg-stone-200/80 rounded-xl transition-colors">
                            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                            <span>체크 초기화</span>
                        </button>
                        <button onclick="openModal('reset-default')" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-warm-700 bg-warm-100/70 hover:bg-warm-200/70 rounded-xl transition-colors" title="기본 목록으로 되돌리기">
                            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                            <span class="hidden sm:inline">기본값 복원</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 메인 체크리스트 컨테이너 -->
    <main class="max-w-3xl mx-auto px-4 sm:px-6 mt-6 space-y-5" id="categories-container">
        <!-- JavaScript로 카테고리 카드들이 렌더링됩니다 -->
    </main>

    <!-- 하단 안내 푸터 -->
    <footer class="max-w-3xl mx-auto px-4 sm:px-6 mt-10 text-center">
        <p class="text-xs text-stone-400 flex items-center justify-center gap-1">
            <i data-lucide="save" class="w-3.5 h-3.5"></i>
            모든 체크 상태와 추가한 항목은 브라우저에 자동 저장됩니다. 안전한 여행 되세요! ✈️
        </p>
    </footer>

    <!-- 커스텀 확인 모달 (alert/confirm 대체) -->
    <div id="custom-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-stone-900/40 backdrop-blur-xs transition-opacity">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl border border-warm-200 transform transition-all scale-95 opacity-0" id="modal-box">
            <div class="flex items-center gap-3 mb-3">
                <div id="modal-icon-bg" class="w-10 h-10 rounded-full bg-warm-100 text-warm-700 flex items-center justify-center shrink-0">
                    <i data-lucide="alert-circle" class="w-5 h-5"></i>
                </div>
                <h3 id="modal-title" class="text-lg font-bold text-stone-800">확인</h3>
            </div>
            <p id="modal-desc" class="text-sm text-stone-600 mb-6 leading-relaxed">
                정말 초기화하시겠습니까?
            </p>
            <div class="flex items-center justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-stone-600 bg-stone-100 hover:bg-stone-200 rounded-xl transition-colors">
                    취소
                </button>
                <button id="modal-confirm-btn" class="px-4 py-2 text-sm font-semibold text-white bg-warm-600 hover:bg-warm-700 rounded-xl shadow-xs transition-colors">
                    확인
                </button>
            </div>
        </div>
    </div>

    <!-- 토스트 알림 -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 translate-y-2">
        <div class="bg-stone-800 text-white text-xs sm:text-sm font-medium px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2">
            <i data-lucide="check-circle-2" class="w-4 h-4 text-sage-500"></i>
            <span id="toast-msg">저장되었습니다.</span>
        </div>
    </div>

    <script>
        // 로컬 스토리지 키
        const STORAGE_KEY = 'jeju_seoul_cheongju_trip_v1';

        // 초기 데이터 구조 (요구사항 완벽 반영)
        const DEFAULT_DATA = [
            {
                id: 'baby',
                emoji: '👶',
                title: '5개월 아기 & 방한',
                subtitle: '육지 추위 완벽 차단 & 수유/외출 필수템',
                isOpen: true,
                items: [
                    { id: 'b1', text: '방한복 / 패딩 우주복 (기모 안감)', checked: false },
                    { id: 'b2', text: '아기 겨울 모자 & 손싸개/양말', checked: false },
                    { id: 'b3', text: '두툼한 방한 블랭킷 & 유모차/아기띠 워머', checked: false },
                    { id: 'b4', text: '기저귀 (4박 5일 넉넉히) & 휴대용 물티슈', checked: false },
                    { id: 'b5', text: '분유 / 젖병 / 보온병 (분유포트 또는 보온병 세척솔)', checked: false },
                    { id: 'b6', text: '아기띠 (힙시트) & 침받이', checked: false },
                    { id: 'b7', text: '아기 여벌옷 (내복, 외출복 하루 2벌 기준) & 손수건', checked: false },
                    { id: 'b8', text: '아기 상비약 (체온계, 해열제, 비판텐, 콧물흡입기 등)', checked: false }
                ]
            },
            {
                id: 'adult',
                emoji: '🧥',
                title: '어른 한파 대비',
                subtitle: '성산 영상 날씨 vs 서울 최저 -4℃ 일교차 대비',
                isOpen: true,
                items: [
                    { id: 'a1', text: '서울 최저 -4℃ 한파용 두꺼운 패딩 / 롱패딩', checked: false },
                    { id: 'a2', text: '이너 레이어드 옷 (히트텍, 니트, 기모 맨투맨 등)', checked: false },
                    { id: 'a3', text: '목도리 / 장갑 / 핫팩 (실외 이동 대비)', checked: false },
                    { id: 'a4', text: '접이식 우산 (기상 변화 대비)', checked: false },
                    { id: 'a5', text: '스마트폰 충전기 & 대용량 보조배터리', checked: false }
                ]
            },
            {
                id: 'travel',
                emoji: '🚗',
                title: '이동 & 숙소',
                subtitle: '항공 탑승 서류, 김포 렌터카, 숙박 체크',
                isOpen: true,
                items: [
                    { id: 't1', text: '항공 신분증(성인) · 아기 주민등록등본 또는 가족관계증명서', checked: false },
                    { id: 't2', text: '김포 렌터카 운전면허증 지참', checked: false },
                    { id: 't3', text: '렌터카 5개월 아기용 카시트(신생아/바구니형 또는 컨버터블) 예약·장착 확인', checked: false },
                    { id: 't4', text: '숙소 준비물 (세면도구, 아기 세제, 충전 멀티탭 등)', checked: false }
                ]
            },
            {
                id: 'mission',
                emoji: '🎮',
                title: '청주 본가 미션',
                subtitle: 'PS4 Pro 정리 및 당근마켓 판매 미션',
                isOpen: true,
                items: [
                    { id: 'm1', text: 'PS4 Pro 1TB 풀박스 구성품 & 듀얼쇼크 2개 상태 확인', checked: false },
                    { id: 'm2', text: '시스템 펌웨어 버전 확인 후 PSN 주 사용 PS4 등록 해제 · 기기 초기화', checked: false },
                    { id: 'm3', text: '청주 본가 도착 후 당근마켓 동네인증 & 판매글 등록', checked: false }
                ]
            }
        ];

        // 상태 변수
        let appData = [];
        let filterUncompletedOnly = false;
        let currentModalAction = null;

        // 초기화 함수
        function init() {
            loadData();
            renderCategories();
            updateSummary();
            setupEventListeners();
        }

        // localStorage에서 데이터 불러오기
        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    appData = JSON.parse(saved);
                } else {
                    appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
                    saveData();
                }
            } catch (e) {
                console.error('데이터 로드 오류:', e);
                appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
            }
        }

        // localStorage에 데이터 저장하기
        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            } catch (e) {
                console.error('데이터 저장 오류:', e);
            }
        }

        // 이벤트 리스너 등록
        function setupEventListeners() {
            const filterCheckbox = document.getElementById('filter-uncompleted');
            filterCheckbox.addEventListener('change', (e) => {
                filterUncompletedOnly = e.target.checked;
                renderCategories();
            });
        }

        // 카테고리 및 항목 렌더링
        function renderCategories() {
            const container = document.getElementById('categories-container');
            container.innerHTML = '';

            appData.forEach((category) => {
                // 카테고리 내 통계 계산
                const totalCount = category.items.length;
                const completedCount = category.items.filter(item => item.checked).length;
                const isAllDone = totalCount > 0 && totalCount === completedCount;

                // 필터링 적용된 항목 리스트
                const visibleItems = filterUncompletedOnly
                    ? category.items.filter(item => !item.checked)
                    : category.items;

                // 카드 엘리먼트 생성
                const card = document.createElement('section');
                card.className = `bg-white rounded-2xl border transition-all duration-200 overflow-hidden shadow-xs ${
                    isAllDone ? 'border-sage-500/40 bg-sage-50/20' : 'border-warm-200/80'
                }`;

                // 카드 헤더 (아코디언 토글)
                const headerHtml = `
                    <div onclick="toggleAccordion('${category.id}')" 
                         class="p-4 sm:p-5 flex items-center justify-between cursor-pointer select-none hover:bg-warm-50/70 transition-colors">
                        <div class="flex items-center gap-3.5">
                            <div class="w-11 h-11 rounded-2xl bg-warm-100/80 border border-warm-200/60 flex items-center justify-center text-2xl shrink-0">
                                ${category.emoji}
                            </div>
                            <div>
                                <div class="flex items-center gap-2 flex-wrap">
                                    <h2 class="text-base sm:text-lg font-bold text-stone-800">${category.title}</h2>
                                    <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full ${
                                        isAllDone 
                                            ? 'bg-sage-100 text-sage-600' 
                                            : 'bg-warm-100 text-warm-800'
                                    }">
                                        ${completedCount}/${totalCount}
                                    </span>
                                </div>
                                <p class="text-xs text-stone-500 mt-0.5">${category.subtitle}</p>
                            </div>
                        </div>
                        <button type="button" class="p-2 text-stone-400 hover:text-stone-700 rounded-xl transition-transform duration-200 ${category.isOpen ? 'rotate-180' : ''}" aria-label="접기/펼치기">
                            <i data-lucide="chevron-down" class="w-5 h-5"></i>
                        </button>
                    </div>
                `;

                // 아이템 리스트 HTML 생성
                let itemsHtml = '';
                if (visibleItems.length === 0) {
                    itemsHtml = `
                        <div class="py-6 text-center text-sm text-stone-400 bg-stone-50/50 rounded-xl border border-dashed border-stone-200 my-2">
                            ${filterUncompletedOnly && totalCount > 0 
                                ? '🎉 이 카테고리의 모든 준비물을 챙겼어요!' 
                                : '등록된 항목이 없습니다. 아래에서 추가해보세요.'}
                        </div>
                    `;
                } else {
                    itemsHtml = `<ul class="divide-y divide-stone-100">`;
                    visibleItems.forEach((item) => {
                        itemsHtml += `
                            <li class="group py-3 px-2 sm:px-3 flex items-center justify-between gap-3 hover:bg-warm-50/50 rounded-xl transition-colors">
                                <label class="checkbox-wrapper flex items-start sm:items-center gap-3.5 cursor-pointer flex-1 select-none py-0.5">
                                    <input type="checkbox" 
                                           class="sr-only" 
                                           ${item.checked ? 'checked' : ''} 
                                           onchange="toggleItem('${category.id}', '${item.id}')">
                                    <div class="w-5 h-5 mt-0.5 sm:mt-0 rounded-md border-2 border-stone-300 bg-white flex items-center justify-center shrink-0 transition-colors group-hover:border-warm-500">
                                        <svg class="check-icon w-3.5 h-3.5 text-white fill-none stroke-current stroke-[3]" viewBox="0 0 24 24">
                                            <polyline points="20 6 9 17 4 12"></polyline>
                                        </svg>
                                    </div>
                                    <span class="text-sm sm:text-[15px] leading-snug transition-all ${
                                        item.checked 
                                            ? 'line-through text-stone-400' 
                                            : 'text-stone-700 font-medium'
                                    }">
                                        ${escapeHtml(item.text)}
                                    </span>
                                </label>
                                <button type="button" 
                                        onclick="deleteItem('${category.id}', '${item.id}')" 
                                        class="p-2 text-stone-300 hover:text-rose-500 hover:bg-rose-50 rounded-lg transition-colors shrink-0 sm:opacity-0 sm:group-hover:opacity-100 focus:opacity-100"
                                        title="항목 삭제"
                                        aria-label="항목 삭제">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </li>
                        `;
                    });
                    itemsHtml += `</ul>`;
                }

                // 항목 직접 추가 입력창 HTML
                const addInputHtml = `
                    <form onsubmit="addItem(event, '${category.id}')" class="mt-3 pt-3 border-t border-stone-100 flex items-center gap-2">
                        <input type="text" 
                               id="input-${category.id}" 
                               placeholder="추가할 준비물이나 할 일을 입력하세요..." 
                               class="flex-1 text-sm bg-stone-50 hover:bg-stone-100/70 focus:bg-white text-stone-800 placeholder-stone-400 px-3.5 py-2.5 rounded-xl border border-stone-200 focus:border-warm-500 focus:outline-none transition-all"
                               required>
                        <button type="submit" 
                                class="inline-flex items-center justify-center gap-1 px-4 py-2.5 bg-warm-600 hover:bg-warm-700 active:scale-95 text-white text-sm font-semibold rounded-xl shadow-xs transition-all shrink-0">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            <span>추가</span>
                        </button>
                    </form>
                `;

                // 본문 컨테이너 (아코디언 열림/닫힘 상태 반영)
                const bodyHtml = `
                    <div class="${category.isOpen ? 'block' : 'hidden'} px-4 sm:px-5 pb-5 pt-1 border-t border-stone-100/80">
                        ${itemsHtml}
                        ${addInputHtml}
                    </div>
                `;

                card.innerHTML = headerHtml + bodyHtml;
                container.appendChild(card);
            });

            // 아이콘 다시 그리기
            lucide.createIcons();
        }

        // 아코디언 열기/닫기
        function toggleAccordion(categoryId) {
            const category = appData.find(c => c.id === categoryId);
            if (category) {
                category.isOpen = !category.isOpen;
                saveData();
                renderCategories();
            }
        }

        // 체크박스 상태 토글
        function toggleItem(categoryId, itemId) {
            const category = appData.find(c => c.id === categoryId);
            if (!category) return;

            const item = category.items.find(i => i.id === itemId);
            if (item) {
                item.checked = !item.checked;
                saveData();
                renderCategories();
                updateSummary();
            }
        }

        // 새 항목 추가
        function addItem(event, categoryId) {
            event.preventDefault();
            const input = document.getElementById(`input-${categoryId}`);
            const text = input.value.trim();
            if (!text) return;

            const category = appData.find(c => c.id === categoryId);
            if (category) {
                category.items.push({
                    id: 'custom_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                    text: text,
                    checked: false
                });
                category.isOpen = true;
                saveData();
                renderCategories();
                updateSummary();
                showToast('새 항목이 추가되었습니다.');
            }
        }

        // 항목 삭제
        function deleteItem(categoryId, itemId) {
            const category = appData.find(c => c.id === categoryId);
            if (!category) return;

            category.items = category.items.filter(i => i.id !== itemId);
            saveData();
            renderCategories();
            updateSummary();
            showToast('항목이 삭제되었습니다.');
        }

        // 상단 요약 카드 진행률 업데이트
        function updateSummary() {
            let total = 0;
            let completed = 0;

            appData.forEach(cat => {
                total += cat.items.length;
                completed += cat.items.filter(i => i.checked).length;
            });

            const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

            document.getElementById('progress-percent').textContent = `${percent}%`;
            document.getElementById('progress-count').textContent = `(${completed} / ${total} 완료)`;
            document.getElementById('progress-bar').style.width = `${percent}%`;

            // 진행률에 따른 응원 문구 배지 변경
            const badge = document.getElementById('status-badge');
            if (total === 0) {
                badge.textContent = '항목을 추가해주세요 📝';
                badge.className = 'text-xs font-semibold px-3 py-1.5 rounded-xl bg-stone-100 text-stone-600';
            } else if (percent === 100) {
                badge.textContent = '출발 준비 완벽 완료! ✈️🎉';
                badge.className = 'text-xs font-semibold px-3 py-1.5 rounded-xl bg-sage-100 text-sage-600';
            } else if (percent >= 70) {
                badge.textContent = '거의 다 챙겼어요! 💪';
                badge.className = 'text-xs font-semibold px-3 py-1.5 rounded-xl bg-warm-200 text-warm-900';
            } else if (percent >= 30) {
                badge.textContent = '순조롭게 준비 중이에요 🧸';
                badge.className = 'text-xs font-semibold px-3 py-1.5 rounded-xl bg-warm-100 text-warm-800';
            } else {
                badge.textContent = '차근차근 챙겨볼까요? 🧳';
                badge.className = 'text-xs font-semibold px-3 py-1.5 rounded-xl bg-warm-100 text-warm-800';
            }
        }

        // 모달 제어 (alert/confirm 대체)
        function openModal(actionType) {
            currentModalAction = actionType;
            const modal = document.getElementById('custom-modal');
            const modalBox = document.getElementById('modal-box');
            const titleEl = document.getElementById('modal-title');
            const descEl = document.getElementById('modal-desc');
            const confirmBtn = document.getElementById('modal-confirm-btn');

            if (actionType === 'reset-check') {
                titleEl.textContent = '전체 체크 초기화';
                descEl.textContent = '모든 항목의 체크 표시를 해제하시겠습니까? 직접 추가한 항목 목록은 그대로 유지됩니다.';
                confirmBtn.textContent = '체크 해제하기';
            } else if (actionType === 'reset-default') {
                titleEl.textContent = '기본 체크리스트로 복원';
                descEl.textContent = '직접 추가하거나 삭제한 내역을 모두 지우고 처음 기본 추천 목록으로 되돌리시겠습니까?';
                confirmBtn.textContent = '기본값 복원';
            }

            confirmBtn.onclick = executeModalAction;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            // 애니메이션 트리거
            requestAnimationFrame(() => {
                modalBox.classList.remove('scale-95', 'opacity-0');
                modalBox.classList.add('scale-100', 'opacity-100');
            });
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const modalBox = document.getElementById('modal-box');

            modalBox.classList.remove('scale-100', 'opacity-100');
            modalBox.classList.add('scale-95', 'opacity-0');

            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                currentModalAction = null;
            }, 150);
        }

        function executeModalAction() {
            if (currentModalAction === 'reset-check') {
                appData.forEach(cat => {
                    cat.items.forEach(item => item.checked = false);
                });
                saveData();
                renderCategories();
                updateSummary();
                showToast('모든 체크 표시가 초기화되었습니다.');
            } else if (currentModalAction === 'reset-default') {
                appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
                saveData();
                renderCategories();
                updateSummary();
                showToast('기본 추천 체크리스트로 복원되었습니다.');
            }
            closeModal();
        }

        // 토스트 알림 표시
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.textContent = message;

            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-2');
            }, 2200);
        }

        // XSS 방지용 HTML 이스케이프
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // 페이지 로드 시 실행
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
